ackground",title:"生ごみの廃棄と、普及しないコンポスト",body:"上京して一人暮らしを始めて感じた、もったいないけど捨てるしかない違和感から出発。家庭の生ごみの多くは可燃ごみとして焼却され、生ごみリサイクルはわずか19%。コンポストが広がらない最大の理由は、できた堆肥の使い道がない「出口の壁」でした。"},{label:"reframing",title:"生ごみ肥料をきっかけに、都市農園を気軽な場所に",body:"近所で見かけたシェア農園がきっかけ。30代の7割が農作業を体験したいのに、都市の農園は応募倍率が1.04倍を超え、参加したくても枠がない。枠の中に入るのではなく、生ごみ肥料をきっかけに誰でも参加できる、区画のない農園を考えました。"},{label:"concept",title:"みんなで食べられるまちづくりへ",list:["食べ残しを肥料にする：暮らしの中で出る食べ残しから、コンポストで肥料をつくる","肥料を農園の土に：つくった肥料を農園に持ちより、土と混ぜ合わせる","食べたいを決め、みんなで育てる：食べたいものを投票して苗を買い、コミュニティで育てる","分けあい食べる：収穫した野菜を、みんなで分け合って食べる"]},{label:"UI",title:"肥料管理の不安をサポートし、農園の活動をみんなで共有",body:"初心者がつまずくコンポストの管理は、状態を色で見せて的確なアドバイスを出す。農園では育てたいものを投票で決め、自分の時間に合わせて作業に参加し、その記録をみんなで共有できるようにしました。"},{label:"growth",title:"肥料の届け先を、遠くの農家から「自分たちの農園」へ",list:["① ハッカソン（3名・2日間）：生ごみを肥料にするとポイント「SOIL」がたまり、農家を支援できるビジネスモデルを提案。4チーム中2位","残った課題：使う人との接点がなかった。品質を重視する農家に、家庭の堆肥の需要は本当にあるのか？","② ハッカソン後（個人）：届け先を近所の「シェア農園」に再設計し、サービスフローと地域全体のモデル、UIをFigmaで設計","③ 現在のブラッシュアップ（個人）：Claude Codeで農園参加のUIを一部改善"]}]},2:{kind:"自主制作",lead:"もちものの愛着を可視化して、同じ愛着を持つ人に出会うフリマアプリ「もちもの美術館」",meta:[{label:"人数",value:"1名"},{label:"期間",value:"2026.5 ／（BU）2026.6"},{label:"スキル",value:"Illustrator、Figma、Gemini"}],blocks:[{label:"theme",title:"モノを手放す体験そのものを、前向きで豊かなものに",body:"大事だったけれど、心を抑えて手放した自分の体験が出発点。捨てる・手放すサービスは売買で効率化されていく一方で、早く手放すのではなく、ゆっくりと納得する向き合い方がほしいと考えました。"},{label:"interview",title:"手放すとき、人は価値観を見ている",body:"フリマアプリを使う社会人2名に、モノの整理と手放し方の価値観を聞きました。",quotes:["「大切さに前もって意識的になることが必要」（Yさん）","「同じものを売っているなら、いい人のところで買いたい」（Sさん）"]},{label:"solution",title:"自分のモノへの価値観を可視化して保管する",list:["STEP 1 取り込みと登録：迷っているものを撮影し、エピソードと今の愛着度、タグを残す","STEP 2 愛着の傾向と可視化：登録したもちものから、自分の愛着の傾向を知る","STEP 3 出会いと循環：愛着度が近いコレクターに出会い、地域の回収イベントや美術館との連携で捨てない循環をつくる"]},{label:"wish",title:"「家の片隅」から",body:"手放すことを効率化するだけでなく、ゆっくりと愛され続けながら残る消費のあり方を、身近な暮らしから実現していきたい。"}]},3:{kind:"インターン制作（mixi2の架空の新機能提案）",lead:"正体を隠して、友達にちょっとしたリアクションを送れるSNS機能「モザイカ」",meta:[{label:"期間",value:"2026.9（1日間）／（BU）2026.10（1週間）"},{label:"スキル",value:"Figma、Gemini、Claude"}],blocks:[{label:"background",title:"つながっているのに、心の距離が遠くなっていく友達",body:"近況は投稿で知れるのに、会話はしていない。勤務体系や住む場所、人生のイベントの違いで連絡が減っていく。実際に、時間差のいいね、メッセージの取り消し、寸止めの閲覧といった行動をしていました。友人との親密さは、連絡の頻度が下がると薄れていくという研究もあります。"},{label:"solution",title:"正体は隠して、リアクションが届けられる",body:"見る側は「バレずに見ていたい」。見られる側は「誰が来たか知りたい」。その両方をかなえるために、誰かは分からないけれど、いつもの人が来たことは分かるリアクションを考えました。"},{label:"process",title:"AIと手作業を行き来して、世界観をつくる",body:"Claudeで簡易案をつくり、AIでUIを生成してから、Figmaで細部の修正と機能の追加を重ねました。匿名だからこその送る側の安心感と、受け手が不安にならない軽さの両立を目指しています。"},{label:"feature",title:"見るだけから、また話せる関係へ",list:["ステップ1：いつものアカウントのまま、色と形を選んでモザイカをつくる","ステップ2：リアクションが投稿の上に浮かぶ。ひとことや手書きでも送れる","ステップ3：正体を明かすと、相手の画面でモザイクがほどけ「あの時の！」がつながる"]},{label:"wish",title:"いつか、誰もが気軽に楽しく声をかけられるように",body:"いまはリアルな友だちとの関係をあたためる機能。その先は、同じコミュニティや同じ「好き」を持つ誰かとの会話のきっかけにしたい。"}]},4:{kind:"産学連携プロジェクト（NHK千葉放送局）",lead:"電磁石で走るモーターカー「ぶんぶんカー」を、親子でつくるワークショップ",meta:[{label:"人数",value:"3名"},{label:"期間",value:"2023.1〜3（3か月）"},{label:"役割",value:"ワークショップの簡略化、キット制作"},{label:"スキル",value:"Illustrator、Rhinoceros"}],blocks:[{label:"background",title:"初の対面イベントで「楽しくて学べる場所」を広げる",body:"コロナ禍から始まった放送局の長期リニューアル。オンラインイベントの補助から関わり、プロジェクトの引き継ぎに自ら手を挙げてメインメンバーになりました。通りすがりの人にも来てもらえるよう、飛び入りでも楽しめる内容を考えました。"},{label:"idea",title:"三者三様のアイデアを「子どもが楽しめるか」で比べて決めた",body:"NHK for Schoolを全員で見て、学びを遊びにつなげるアイデアを出し合い、制作時間・安全性・難易度で絞り込みました。"},{label:"prototype & test",title:"だれが作っても走るように",body:"試作は10回以上、テストは4回。コイルをきれいに作れず回らないことが分かり、コイルではなく磁石を回す方式に簡略化しました。親子で協力してつくることも視野に、難易度を調整しています。"},{label:"event",title:"子どもから大人まで、計40組が参加",body:"全員が車を走らせ、子どもだけでなく親や引率の先生まで一体となって楽しんでもらえました。小学生以下の参加が想定より多く、難易度と理解度に差が出たことは課題として残りました。"},{label:"next action",title:"イメージをいち早く形にして、共有で意思決定につなげる",body:"それぞれが作業に集中し、共有と連携がうまくいかなかったことが壁でした。この学びを、次のオープンキャンパスでの進め方につなげました。"}]},5:{kind:"学内プロジェクト",lead:"高校生に向けたオープンキャンパスの企画運営「心うつ日々、ここから」",meta:[{label:"人数",value:"10名"},{label:"期間",value:"2023.4〜8（4か月）"},{label:"役割",value:"空間・展示責任者"},{label:"スキル",value:"Rhinoceros、Illustrator、マネジメント"}],blocks:[{label:"purpose",title:"学生だからこそ伝えられる、デザイン科学科の魅力を",body:"進路を考える高校生に、パンフレットには載らない学生視点での学びや活動を届ける。ワークショップ・グラフィック・空間展示の3チームに分かれ、空間・展示の責任者として展示物集めから空間設計、モデリングまでを担当しました。"},{label:"challenge",title:"議論が止まるのは、全員が同じ絵を見ていないとき",list:["どれだけの高校生が来るのか、事前に分からない","ブースが混んだとき、何人まで受け止められるか見えない","「見せ方」を優先したいチームと「動線確保」を優先したいチームで対立"]},{label:"action",title:"素早く形にして、同じ絵の上で議論する",list:["来場者の想定や会場の条件を先回りして集め、CGや模型ですぐに見える形に","ワークショップの回転率から、混雑時に受け入れられる人数を全員で確認","見せ方と動線、それぞれの案を図面にして比べる","チームをまたいで意見を出しやすい場をつくり、迷いを減らす"]},{label:"result",title:"計639名がブースに来場",body:"見て、触れて、話すが活発な空間を実現できました。素早く形にして検討したことで、どのチームも納得感を持って進められました。",quotes:["「一番入りやすかった」","「おしゃれなブースで楽しかった」","「入学出来たら運営側もやってみたい」"]}]},6:{kind:"自主制作",lead:"お茶の水面のゆらぎを、光と影で映すランプシェード",meta:[{label:"人数",value:"1名"},{label:"期間",value:"2023.1（1週間）"},{label:"スキル",value:"Rhinoceros、Grasshopper、Twinmotion"}],blocks:[{label:"theme",title:"自分の好きなものに合う照明をつくる",body:"好きなのは、飲み物の波立ちや揺らぎ。静かにお茶を飲む時間にも、水の揺らぎを楽しめる照明をつくりたいと考えました。コンセプトは「お茶の水面に映る枯山水」。"},{label:"process",title:"線で考えていたものを、点で再構築する",list:["球体を点で再構築し、周囲の点を引き寄せて線をゆがませる","プロトタイプ1：枯山水のような模様はできたが、水の揺らぎは表れなかった","引き寄せる点を複数にして、水の揺らぎのような形に"]},{label:"output",title:"同じ光が、変数と置き方で表情を変える",body:"卓上に置くと、机いっぱいに波紋が広がる。Grasshopperの変数だけを変えると、さざ波から波立ちまで表情が変わります。"},{label:"learning",title:"まずやってみて、予想外の形も次の発想につなげる",body:"アルゴリズムを使うと、手作業の検討では生まれない意図しない形や偶然が生まれる。その発見と思考の行き来が、デザインの幅を広げることに気づきました。"}]},7:{kind:"海外インターン",lead:"モンゴル 日本語教師インターン",meta:[{label:"人数",value:"学生12名"},{label:"期間",value:"2025.8（1か月）"},{label:"役割",value:"日本語教師"},{label:"活動",value:"授業、イベント運営、現地生徒・教員との交流"}],blocks:[{label:"episode",title:"想像もできない価値観の中へ",body:"想像もできない価値観の人しかいない場所に身を置きたいと参加。常識が通用しないモンゴルで、現地の高校生に日本語を教えました。授業の外では、生徒と一緒に日本語の劇をつくり、一人ひとりの強みを生かした役割づくりと交流に力を入れました。"}]},8:{kind:"graphic",lead:"ソリ競技リュージュ 小林誠也選手のマスコットキャラクター",meta:[{label:"人数",value:"個人"},{label:"期間",value:"1か月"},{label:"スキル",value:"Illustrator"}],blocks:[{label:"episode",title:"初めてのグラフィック制作に挑戦",body:"ソリ競技リュージュの小林誠也選手のマスコットキャラクターのデザインを担当。初めてのグラフィック制作で、右も左もわからないところからの挑戦でした。"}]},9:{kind:"contents",lead:"AIを用いた脱出ゲーム「雪山からの脱出」",meta:[{label:"人数",value:"個人"},{label:"期間",value:"3日間"},{label:"スキル",val
