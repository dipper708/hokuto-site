,"② ハッカソン後（個人）：届け先を近所の「シェア農園」に再設計し、サービスフローと地域全体のモデル、UIをFigmaで設計","③ 現在のブラッシュアップ（個人）：Claude Codeで農園参加のUIを一部改善"]}]},2:{kind:"自主制作",lead:"もちものの愛着を可視化して、同じ愛着を持つ人に出会うフリマアプリ「もちもの美術館」",meta:[{label:"人数",value:"1名"},{label:"期間",value:"2026.5 ／（BU）2026.6"},{label:"スキル",value:"Illustrator、Figma、Gemini"}],blocks:[{label:"theme",title:"モノを手放す体験そのものを、前向きで豊かなものに",body:"大事だったけれど、心を抑えて手放した自分の体験が出発点。捨てる・手放すサービスは売買で効率化されていく一方で、早く手放すのではなく、ゆっくりと納得する向き合い方がほしいと考えました。"},{label:"interview",title:"手放すとき、人は価値観を見ている",body:"フリマアプリを使う社会人2名に、モノの整理と手放し方の価値観を聞きました。",quotes:["「大切さに前もって意識的になることが必要」（Yさん）","「同じものを売っているなら、いい人のところで買いたい」（Sさん）"]},{label:"solution",title:"自分のモノへの価値観を可視化して保管する",list:["STEP 1 取り込みと登録：迷っているものを撮影し、エピソードと今の愛着度、タグを残す","STEP 2 愛着の傾向と可視化：登録したもちものから、自分の愛着の傾向を知る","STEP 3 出会いと循環：愛着度が近いコレクターに出会い、地域の回収イベントや美術館との連携で捨てない循環をつくる"]},{label:"wish",title:"「家の片隅」から",body:"手放すことを効率化するだけでなく、ゆっくりと愛され続けながら残る消費のあり方を、身近な暮らしから実現していきたい。"}]},3:{kind:"インターン制作（mixi2の架空の新機能提案）",lead:"正体を隠して、友達にちょっとしたリアクションを送れるSNS機能「モザイカ」",meta:[{label:"期間",value:"2026.9（1日間）／（BU）2026.10（1週間）"},{label:"スキル",value:"Figma、Gemini、Claude"}],blocks:[{label:"background",title:"つながっているのに、心の距離が遠くなっていく友達",body:"近況は投稿で知れるのに、会話はしていない。勤務体系や住む場所、人生のイベントの違いで連絡が減っていく。実際に、時間差のいいね、メッセージの取り消し、寸止めの閲覧といった行動をしていました。友人との親密さは、連絡の頻度が下がると薄れていくという研究もあります。"},{label:"solution",title:"正体は隠して、リアクションが届けられる",body:"見る側は「バレずに見ていたい」。見られる側は「誰が来たか知りたい」。その両方をかなえるために、誰かは分からないけれど、いつもの人が来たことは分かるリアクションを考えました。"},{label:"process",title:"AIと手作業を行き来して、世界観をつくる",body:"Claudeで簡易案をつくり、AIでUIを生成してから、Figmaで細部の修正と機能の追加を重ねました。匿名だからこその送る側の安心感と、受け手が不安にならない軽さの両立を目指しています。"},{label:"feature",title:"見るだけから、また話せる関係へ",list:["ステップ1：いつものアカウントのまま、色と形を選んでモザイカをつくる","ステップ2：リアクションが投稿の上に浮かぶ。ひとことや手書きでも送れる","ステップ3：正体を明かすと、相手の画面でモザイクがほどけ「あの時の！」がつながる"]},{label:"wish",title:"いつか、誰もが気軽に楽しく声をかけられるように",body:"いまはリアルな友だちとの関係をあたためる機能。その先は、同じコミュニティや同じ「好き」を持つ誰かとの会話のきっかけにしたい。"}]},4:{kind:"産学連携プロジェクト（NHK千葉放送局）",lead:"電磁石で走るモーターカー「ぶんぶんカー」を、親子でつくるワークショップ",meta:[{label:"人数",value:"3名"},{label:"期間",value:"2023.1〜3（3か月）"},{label:"役割",value:"ワークショップの簡略化、キット制作"},{label:"スキル",value:"Illustrator、Rhinoceros"}],blocks:[{label:"background",title:"初の対面イベントで「楽しくて学べる場所」を広げる",body:"コロナ禍から始まった放送局の長期リニューアル。オンラインイベントの補助から関わり、プロジェクトの引き継ぎに自ら手を挙げてメインメンバーになりました。通りすがりの人にも来てもらえるよう、飛び入りでも楽しめる内容を考えました。"},{label:"idea",title:"三者三様のアイデアを「子どもが楽しめるか」で比べて決めた",body:"NHK for Schoolを全員で見て、学びを遊びにつなげるアイデアを出し合い、制作時間・安全性・難易度で絞り込みました。"},{label:"prototype & test",title:"だれが作っても走るように",body:"試作は10回以上、テストは4回。コイルをきれいに作れず回らないことが分かり、コイルではなく磁石を回す方式に簡略化しました。親子で協力してつくることも視野に、難易度を調整しています。"},{label:"event",title:"子どもから大人まで、計40組が参加",body:"全員が車を走らせ、子どもだけでなく親や引率の先生まで一体となって楽しんでもらえました。小学生以下の参加が想定より多く、難易度と理解度に差が出たことは課題として残りました。"},{label:"next action",title:"イメージをいち早く形にして、共有で意思決定につなげる",body:"それぞれが作業に集中し、共有と連携がうまくいかなかったことが壁でした。この学びを、次のオープンキャンパスでの進め方につなげました。"}]},5:{kind:"学内プロジェクト",lead:"高校生に向けたオープンキャンパスの企画運営「心うつ日々、ここから」",meta:[{label:"人数",value:"10名"},{label:"期間",value:"2023.4〜8（4か月）"},{label:"役割",value:"空間・展示責任者"},{label:"スキル",value:"Rhinoceros、Illustrator、マネジメント"}],blocks:[{label:"purpose",title:"学生だからこそ伝えられる、デザイン科学科の魅力を",body:"進路を考える高校生に、パンフレットには載らない学生視点での学びや活動を届ける。ワークショップ・グラフィック・空間展示の3チームに分かれ、空間・展示の責任者として展示物集めから空間設計、モデリングまでを担当しました。"},{label:"challenge",title:"議論が止まるのは、全員が同じ絵を見ていないとき",list:["どれだけの高校生が来るのか、事前に分からない","ブースが混んだとき、何人まで受け止められるか見えない","「見せ方」を優先したいチームと「動線確保」を優先したいチームで対立"]},{label:"action",title:"素早く形にして、同じ絵の上で議論する",list:["来場者の想定や会場の条件を先回りして集め、CGや模型ですぐに見える形に","ワークショップの回転率から、混雑時に受け入れられる人数を全員で確認","見せ方と動線、それぞれの案を図面にして比べる","チームをまたいで意見を出しやすい場をつくり、迷いを減らす"]},{label:"result",title:"計639名がブースに来場",body:"見て、触れて、話すが活発な空間を実現できました。素早く形にして検討したことで、どのチームも納得感を持って進められました。",quotes:["「一番入りやすかった」","「おしゃれなブースで楽しかった」","「入学出来たら運営側もやってみたい」"]}]},6:{kind:"自主制作",lead:"お茶の水面のゆらぎを、光と影で映すランプシェード",meta:[{label:"人数",value:"1名"},{label:"期間",value:"2023.1（1週間）"},{label:"スキル",value:"Rhinoceros、Grasshopper、Twinmotion"}],blocks:[{label:"theme",title:"自分の好きなものに合う照明をつくる",body:"好きなのは、飲み物の波立ちや揺らぎ。静かにお茶を飲む時間にも、水の揺らぎを楽しめる照明をつくりたいと考えました。コンセプトは「お茶の水面に映る枯山水」。"},{label:"process",title:"線で考えていたものを、点で再構築する",list:["球体を点で再構築し、周囲の点を引き寄せて線をゆがませる","プロトタイプ1：枯山水のような模様はできたが、水の揺らぎは表れなかった","引き寄せる点を複数にして、水の揺らぎのような形に"]},{label:"output",title:"同じ光が、変数と置き方で表情を変える",body:"卓上に置くと、机いっぱいに波紋が広がる。Grasshopperの変数だけを変えると、さざ波から波立ちまで表情が変わります。"},{label:"learning",title:"まずやってみて、予想外の形も次の発想につなげる",body:"アルゴリズムを使うと、手作業の検討では生まれない意図しない形や偶然が生まれる。その発見と思考の行き来が、デザインの幅を広げることに気づきました。"}]},7:{kind:"海外インターン",lead:"モンゴル 日本語教師インターン",meta:[{label:"人数",value:"学生12名"},{label:"期間",value:"2025.8（1か月）"},{label:"役割",value:"日本語教師"},{label:"活動",value:"授業、イベント運営、現地生徒・教員との交流"}],blocks:[{label:"episode",title:"想像もできない価値観の中へ",body:"想像もできない価値観の人しかいない場所に身を置きたいと参加。常識が通用しないモンゴルで、現地の高校生に日本語を教えました。授業の外では、生徒と一緒に日本語の劇をつくり、一人ひとりの強みを生かした役割づくりと交流に力を入れました。"}]},8:{kind:"graphic",lead:"ソリ競技リュージュ 小林誠也選手のマスコットキャラクター",meta:[{label:"人数",value:"個人"},{label:"期間",value:"1か月"},{label:"スキル",value:"Illustrator"}],blocks:[{label:"episode",title:"初めてのグラフィック制作に挑戦",body:"ソリ競技リュージュの小林誠也選手のマスコットキャラクターのデザインを担当。初めてのグラフィック制作で、右も左もわからないところからの挑戦でした。"}]},14:{kind:"自主制作（Webアプリ）",play:{href:"https://tomoshi-delta.vercel.app/",text:"Tomoshi Timerを使う"},lead:"会話や顔出しなしで、ほかの人も作業していることがわかる作業用タイマー「Tomoshi Timer」",meta:[{label:"人数",value:"1名"},{label:"期間",value:"2026.11（1週間）"},{label:"スキル",value:"Claude、three.js、Supabase"},{label:"公開",value:"tomoshi-delta.vercel.app"}],blocks:[{label:"about",title:"一人でもくもくもアリ。でも、誰かとゆるく作業時間を共有したい",body:"一人でもくもくと作業するのもアリですが、誰かとゆるく作業時間を共有したいときに使ってもらうことを想定したタイマーです。同じ部屋に入った人どうしで、集中と休憩の時間がそろいます。登録なしで、スマホ・PCから使えます。"},{label:"background",title:"作業通話は、ちょっと作業したいだけのときには負担が大きい",body:"自習室やカフェでは、周りで作業している人がいることで集中しやすくなります。一方、オンラインの作業通話は顔や声を出す必要があり、気軽には使いにくい。そこで、参加者の状態だけを共有するタイマーにしました。画面は、複数人で囲んでも自然な焚き火をモチーフにしています。"},{label:"design",title:"ほかの人の存在がわかる3つの工夫",list:["参加人数に応じて、火が大きくなる：参加者は名前付きの火の粉として焚き火のまわりに表示され、人数が増えると炎と火の音が大きくなる","全員の集中・休憩を同時に切り替える：終わる3秒前に木琴、切り替わりにおりんの音が鳴る","休憩中だけ、簡単なやりとりができる：マシュマロを焼く・花火を打ち上げる・ひとこと送る"]},{label:"system",title:"時間をそろえ、状態だけを共有するしくみ",list:["タイマーをサーバーで管理せず、部屋の番号と現在時刻から各端末が残り時間を計算する。途中から入っても、通信が途切れても時間がずれない","共有するのは「入室中・離席中・マシュマロ・花火・ひとこと」だけ。音声や映像は扱わず、ひとことも保存しない","1部屋100人まで。人数が多いときは表示する名前や串の数をしぼり、通信の間隔も広げる"]},{label:"learned",title:"機能の数より、ほかの人がいるとわかることが大事",body:"作りながら見直す中で、機能の多さよりも「ほかの人も作業している」とわかることのほうが重要だと気づきました。人数を数字ではなく火の粉や炎の大きさで、切り替わりを通知ではなく音で伝えるなど、表示の方法を工夫することで、会話がなくても一緒に作業している状態をつくれました。"},{label:"play",title:"ブラウザでそのまま使えます",body:"登録なしで、スマホ・PCのブラウザから使えます。",link:{href:"https://tomoshi-delta.vercel.app/",text:"Tomoshi Timerを使う"}}]},12:{kind:"自主制作（ブラウザゲーム）",play:{href:"https://yukibana-issen.vercel.app/",text:"雪華一閃を遊ぶ"},lead:"敵を倒しながら技を強化して、ボスを倒していく侍のアクションゲーム「雪華一閃」",meta:[{label:"人数",value:"個人"},{label:"期間",value:"2026.11"},{label:"スキル",value:"Claude、Three.js（WebGL）"}],blocks:[{label:"theme",title:"写真の雰囲気でゲームを作る",body:"ボクセルで作られた雪景色の写真をもとに、同じ雰囲気で遊べるゲームを作りました。侍が迫ってくる敵を倒していき、倒すほど技が強くなっていくゲームです。"},{label:"system",title:"ゲームの内容",list:["技は10種類あり、それぞれ4段階まで強化できる","レベルが上がったときと秘伝書を拾ったときに、3つの候補から1つ選んで強化する","ボスは5体。倒すと次のボスが出てくる","敵は7種類で、それぞれ攻撃の仕方が違う"]},{label:"process",title:"遊んで気になったところを直す",list:["最初は簡単すぎたので、敵の攻撃の種類を増やして難しくした","今度は最初から難しくなったので、時間がたつにつれて難しくなるように変えた","キャラクターが四角の集まりだったので、ローポリにして滑らかにした","効果音が安っぽかったので作り直した"]},{label:"play",title:"遊び方",body:"PCはWASDか矢印キー、スマホは画面を押した方向に歩きます。",link:{href:"https://yukibana-issen.vercel.app/",text:"雪華一閃を遊ぶ"}}]},13:{kind:"自主制作（ブラウザゲーム）",play:{href:"https://ashiato-no-mori.vercel.app/",text:"足あとの森を遊ぶ"},lead:"雪の中の足あとをたどって、森に残されたリュックを持ち帰るゲーム「足あとの森」",meta:[{label:"人数",value:"個人"},{label:"期間",value:"2026.11"},{label:"スキル",value:"Claude、Three.js（WebGL）"}],blocks:[{label:"theme",title:"写真の雰囲気でゲームを作る",body:"青い木と雪原、テントと焚き火が写った写真をもとに、同じ雰囲気の中を歩けるゲームを作りました。木は細い毛を集めて作り、写真のふわふわした感じに近づけています。"},{label:"system",title:"ゲームの内容",list:["森に残された5つのリュックを、足あとをたどって探す","帰り道の目印は自分の足あと。雪で少しずつ消え、吹雪になると早く消える","焚き火から離れると体温が下がる。倒れてもリュックはその場に残る","1つ持ち帰るごとに、朝から夜へ時間が進む"]},{label:"play",title:"遊び方",body:"PCはWASDか矢印キー、スマホは画面を押した方向に歩きます。",link:{href:"https://ashiato-no-mori.vercel.app/",text:"足あとの森を遊ぶ"}}]},9:{kind:"contents",lead:"AIを用いた脱出ゲーム「雪山からの脱出」",met
